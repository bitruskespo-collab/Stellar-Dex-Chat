name: Deploy FiatBridge to Futurenet

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'Dechat/stellar-contracts/**'
      - '.github/workflows/deploy-futurenet.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Futurenet
    runs-on: ubuntu-latest
    environment: futurenet
    
    defaults:
      run:
        working-directory: Dechat/stellar-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 28.0.0

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Dechat/stellar-contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Dechat/stellar-contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build contract
        run: stellar contract build

      - name: Generate Rust SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.5
          cargo cyclonedx --format json --output-cdx --override-filename sbom-rust.cdx.json

      - name: Generate Node SBOM (CycloneDX)
        working-directory: Dechat/dex_with_fiat_frontend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@^1.19.0 --output-file sbom-node.cdx.json --output-format json

      - name: Pre-deployment readiness gate
        id: readiness
        env:
          FUTURENET_ADMIN_SECRET_KEY: ${{ secrets.FUTURENET_ADMIN_SECRET_KEY }}
          FUTURENET_RPC_URL: https://rpc-futurenet.stellar.org
          FUTURENET_NETWORK_PASSPHRASE: 'Test SDF Future Network ; April 2020'
          EXPECTED_NETWORK_PASSPHRASE: 'Test SDF Future Network ; April 2020'
          OVERRIDE_REASON: ${{ vars.READINESS_OVERRIDE_REASON }}
        run: |
          set -uo pipefail
          FAILED=0
          record() {
            # $1=check $2=status(ok|fail) $3=owner $4=recovery
            echo "| $1 | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" = "fail" ]; then FAILED=1; fi
          }
          echo "## 🚦 Pre-deployment Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status | Owner | Recovery |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          # 1. Artifact digest
          WASM_PATH=$(find target -name '*.wasm' -path '*release*' | head -n 1)
          if [ -n "$WASM_PATH" ] && [ -s "$WASM_PATH" ]; then
            DIGEST=$(sha256sum "$WASM_PATH" | awk '{print $1}')
            echo "wasm_path=$WASM_PATH" >> $GITHUB_OUTPUT
            echo "wasm_digest=$DIGEST" >> $GITHUB_OUTPUT
            record "artifact-digest" "ok" "@contract-owner" "Rebuild contract; see docs/runbooks/contract-deploy.md"
          else
            record "artifact-digest" "fail" "@contract-owner" "Rebuild contract; see docs/runbooks/contract-deploy.md"
          fi

          # 2. Network / config
          if [ "$FUTURENET_NETWORK_PASSPHRASE" = "$EXPECTED_NETWORK_PASSPHRASE" ] && [ -n "$FUTURENET_RPC_URL" ]; then
            record "network-config" "ok" "@platform-owner" "Verify network passphrase/RPC; see docs/runbooks/network-config.md"
          else
            record "network-config" "fail" "@platform-owner" "Verify network passphrase/RPC; see docs/runbooks/network-config.md"
          fi

          # 3. Migrations
          if [ -d migrations ] || [ -f migrations ]; then
            record "migrations" "ok" "@contract-owner" "Review pending migrations; see docs/runbooks/migrations.md"
          else
            record "migrations" "ok" "@contract-owner" "No migrations directory; see docs/runbooks/migrations.md"
          fi

          # 4. Signer availability
          if [ -n "${FUTURENET_ADMIN_SECRET_KEY:-}" ]; then
            record "signer-availability" "ok" "@security-owner" "Rotate/restore admin signer; see docs/runbooks/signer.md"
          else
            record "signer-availability" "fail" "@security-owner" "Rotate/restore admin signer; see docs/runbooks/signer.md"
          fi

          # 5. Provider health
          if curl -fsS --max-time 10 "$FUTURENET_RPC_URL" -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' > /dev/null; then
            record "provider-health" "ok" "@platform-owner" "Check RPC provider status; see docs/runbooks/provider-health.md"
          else
            record "provider-health" "fail" "@platform-owner" "Check RPC provider status; see docs/runbooks/provider-health.md"
          fi

          # 6. Rollback readiness
          if [ -f scripts/deploy_fiat_bridge_futurenet.sh ]; then
            record "rollback-readiness" "ok" "@release-manager" "Execute rollback; see docs/runbooks/rollback.md"
          else
            record "rollback-readiness" "fail" "@release-manager" "Execute rollback; see docs/runbooks/rollback.md"
          fi

          if [ "$FAILED" -ne 0 ]; then
            if [ -n "${OVERRIDE_REASON:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **Authorized override recorded:** $OVERRIDE_REASON" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Readiness gate overridden: $OVERRIDE_REASON"
            else
              echo "::error::Readiness gate failed; promotion blocked. Set READINESS_OVERRIDE_REASON to authorize an override."
              exit 1
            fi
          fi

      - name: Deploy to Futurenet
        id: deploy
        env:
          FUTURENET_ADMIN_SECRET_KEY: ${{ secrets.FUTURENET_ADMIN_SECRET_KEY }}
          FUTURENET_RPC_URL: https://rpc-futurenet.stellar.org
          FUTURENET_NETWORK_PASSPHRASE: 'Test SDF Future Network ; April 2020'
          OUTPUT_FILE: ./contract_id_futurenet.txt
        run: |
          chmod +x ./scripts/deploy_fiat_bridge_futurenet.sh
          ./scripts/deploy_fiat_bridge_futurenet.sh
          
          # Pass outputs to GitHub Actions context
          CONTRACT_ID=$(cat "$OUTPUT_FILE")
          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT

      - name: Compute artifact digests and provenance
        id: provenance
        run: |
          WASM_PATH="${{ steps.readiness.outputs.wasm_path }}"
          if [ -z "$WASM_PATH" ]; then
            WASM_PATH=$(find target -name '*.wasm' -path '*release*' | head -n 1)
          fi
          if [ -z "$WASM_PATH" ]; then
            echo "::error::No release WASM artifact found for provenance"
            exit 1
          fi
          WASM_DIGEST=$(sha256sum "$WASM_PATH" | awk '{print $1}')
          echo "wasm_path=$WASM_PATH" >> $GITHUB_OUTPUT
          echo "wasm_digest=$WASM_DIGEST" >> $GITHUB_OUTPUT

          cat > provenance.json <<EOF
          {
            "source_revision": "${{ github.sha }}",
            "workflow_ref": "${{ github.workflow_ref }}",
            "workflow_sha": "${{ github.workflow_sha }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "wasm_artifact": "$WASM_PATH",
            "wasm_sha256": "$WASM_DIGEST",
            "contract_id": "${{ steps.deploy.outputs.contract_id }}"
          }
          EOF

      - name: Post-deployment canary verification
        id: canary
        env:
          FUTURENET_RPC_URL: https://rpc-futurenet.stellar.org
          FUTURENET_NETWORK_PASSPHRASE: 'Test SDF Future Network ; April 2020'
          EXPECTED_NETWORK_PASSPHRASE: 'Test SDF Future Network ; April 2020'
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          OVERRIDE_REASON: ${{ vars.READINESS_OVERRIDE_REASON }}
        run: |
          set -uo pipefail
          FAILED=0
          record() {
            echo "| $1 | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" = "fail" ]; then FAILED=1; fi
          }
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🐤 Post-deployment Canary Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canary | Status | Owner | Recovery |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          # 1. Chain identity (read-only)
          CHAIN=$(curl -fsS --max-time 10 "$FUTURENET_RPC_URL" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getNetwork"}' | jq -r '.result.passphrase // empty')
          if [ "$CHAIN" = "$EXPECTED_NETWORK_PASSPHRASE" ]; then
            record "chain-identity" "ok" "@platform-owner" "Verify network passphrase; see docs/runbooks/network-config.md"
          else
            record "chain-identity" "fail" "@platform-owner" "Verify network passphrase; see docs/runbooks/network-config.md"
          fi

          # 2. Contract queries (read-only)
          if [ -n "$CONTRACT_ID" ] && curl -fsS --max-time 10 "$FUTURENET_RPC_URL" -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getContractData\",\"params\":{\"contractId\":\"$CONTRACT_ID\"}}" > /dev/null; then
            record "contract-queries" "ok" "@contract-owner" "Inspect contract state; see docs/runbooks/contract-deploy.md"
          else
            record "contract-queries" "fail" "@contract-owner" "Inspect contract state; see docs/runbooks/contract-deploy.md"
          fi

          # 3. API health (read-only)
          if curl -fsS --max-time 10 "$FUTURENET_RPC_URL" -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' > /dev/null; then
            record "api-health" "ok" "@platform-owner" "Check RPC/API status; see docs/runbooks/provider-health.md"
          else
            record "api-health" "fail" "@platform-owner" "Check RPC/API status; see docs/runbooks/provider-health.md"
          fi

          # 4. Safe provider checks (read-only)
          if curl -fsS --max-time 10 "$FUTURENET_RPC_URL" -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}' > /dev/null; then
            record "provider-checks" "ok" "@platform-owner" "Check provider status; see docs/runbooks/provider-health.md"
          else
            record "provider-checks" "fail" "@platform-owner" "Check provider status; see docs/runbooks/provider-health.md"
          fi

          if [ "$FAILED" -ne 0 ]; then
            if [ -n "${OVERRIDE_REASON:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ **Authorized override recorded:** $OVERRIDE_REASON" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Canary gate overridden: $OVERRIDE_REASON"
            else
              echo "::error::Canary verification failed; promotion blocked. Set READINESS_OVERRIDE_REASON to authorize an override."
              exit 1
            fi
          fi

      - name: Upload contract ID artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-deployment-${{ github.sha }}
          path: Dechat/stellar-contracts/contract_id_futurenet.txt
          retention-days: 90

      - name: Upload SBOM and provenance artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-${{ github.sha }}
          path: |
            Dechat/stellar-contracts/sbom-rust.cdx.json
            Dechat/dex_with_fiat_frontend/sbom-node.cdx.json
            Dechat/stellar-contracts/provenance.json
          retention-days: 90

      - name: Create deployment status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const conclusion = status === 'success' ? '✅ Deployment successful' : '❌ Deployment failed';
            
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'futurenet',
              required_contexts: [],
              auto_merge: false,
              description: 'FiatBridge Smart Contract Deployment'
            })

      - name: Post deployment summary
        if: success()
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Futurenet" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID:** ${{ steps.deploy.outputs.contract_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**WASM SHA256:** ${{ steps.provenance.outputs.wasm_digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** release-sbom-${{ github.sha }} (CycloneDX: Rust + Node)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: Futurenet" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY

  release-validation:
    name: Verify release SBOM and provenance
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Download SBOM and provenance artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: release-sbom-${{ github.sha }}
          path: release-sbom

      - name: Verify SBOM inventories and provenance
        run: |
          set -euo pipefail

          for f in release-sbom/sbom-rust.cdx.json release-sbom/sbom-node.cdx.json; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty SBOM: $f"
              exit 1
            fi
            jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$f" > /dev/null
            echo "✅ Verified SBOM: $f"
          done

          PROV=release-sbom/provenance.json
          if [ ! -s "$PROV" ]; then
            echo "::error::Missing provenance file"
            exit 1
          fi

          jq -e --arg sha "${{ github.sha }}" '.source_revision == $sha' "$PROV" > /dev/null
          jq -e '.workflow_ref != "" and .workflow_sha != ""' "$PROV" > /dev/null
          jq -e '.wasm_sha256 | test("^[0-9a-f]{64}$")' "$PROV" > /dev/null

          echo "✅ Provenance verified for revision ${{ github.sha }}"

      - name: Post validation summary
        run: |
          echo "## 🔐 Release Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ SBOM and provenance verified" >> $GITHUB_STEP_SUMMARY
          echo "**Revision:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow_ref }}" >> $GITHUB_STEP_SUMMARY
