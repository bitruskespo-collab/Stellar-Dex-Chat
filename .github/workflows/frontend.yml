name: Frontend CI

# ── Job graph ────────────────────────────────────────────────────────────────
#
#   lint ──────────────────────────────────────────────────────────┐
#   build ─────────────────────────────────────────────────────────┤──► e2e
#   unit-tests (matrix ×4, parallel) ──► coverage-merge ──────────┘
#
# build and unit-tests are independent: a test failure does not hide a build
# failure and vice-versa.  e2e waits only for build + lint so it starts as
# soon as the app compiles, without waiting for unit tests.
#
# ── Path-aware gating (issue #125) ───────────────────────────────────────────
# Frontend checks run when frontend sources change, and also whenever shared
# inputs change that could affect the build/test result:
#   - the frontend lockfile (dependency drift)
#   - any workflow file (CI logic changes)
#   - security / dependency config (Dependabot, CodeQL, etc.)
# These shared paths are intentionally NOT excluded so they cannot bypass
# required checks.  Job names below are stable and referenced by branch
# protection — do not rename without updating the protection rules.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"
      - "SECURITY.md"

# Least privilege by default: read-only.  Individual jobs that need to write
# (e.g. PR comments, releases) must grant the narrow scope they require.
permissions:
  contents: read

# Shared env block referenced by build, unit-tests and e2e.
env:
  NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_STELLAR_CONTRACT_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_XLM_SAC_ID: ${{ secrets.NEXT_PUBLIC_XLM_SAC_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
  NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK || 'TESTNET' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER' }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'PLACEHOLDER' }}
  PAYOUT_PROVIDER: ${{ secrets.PAYOUT_PROVIDER || 'paystack' }}

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Prettier check
        run: pnpm check

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

  # ── 2. Next.js build (independent of unit tests) ──────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  # ── 3. Unit tests — 4 shards run in parallel ──────────────────────────────
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Let all shards finish so we always collect all blob artifacts even when
      # one shard has failures — coverage-merge needs every blob.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          pnpm vitest run \
            --coverage \
            --maxWorkers=1 \
            --pool=forks \
            --no-file-parallelism \
            --reporter=blob \
            --reporter=dot \
            --coverage.reporter=json-summary \
            --coverage.clean \
            --shard=${{ matrix.shard }}/4
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Upload the vitest blob so coverage-merge can reconstruct full coverage.
      # The blob lands in .vitest-reports/ by vitest convention.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/.vitest-reports/
          retention-days: 1

      # Upload per-shard coverage-summary.json so coverage-merge has something
      # to work with even if --mergeReports fails.
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/coverage/coverage-summary.json
          retention-days: 1

  # ── 4. Merge coverage blobs, produce report, write job summary ────────────
  coverage-merge:
    name: Coverage merge & report
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run when shards finish (pass or fail) so we always produce coverage data.
    # Skip only if the unit-tests job itself was skipped (e.g. path filter).
    if: needs.unit-tests.result != 'skipped'
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # Download all four blob artifacts into .vitest-reports/ so vitest can
      # find them with its default --mergeReports path.
      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: Dechat/dex_with_fiat_frontend/.vitest-reports
          merge-multiple: true

      - name: Merge reports and regenerate coverage
        run: |
          pnpm vitest run \
            --mergeReports \
            --coverage \
            --reporter=default
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # NOTE: coverage.thresholds are not configured in vitest.config.ts yet.
        # The numbers below (stmt 70%, branch 65%, fn 70%, lines 70%) are targets
        # only; this step does not fail on low coverage until thresholds are added.

      # Build the JSON consumed by coverage-comment.yml.
      - name: Generate coverage report artifact
        id: coverage_report
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const report = {
              pr_number: ${{ github.event.pull_request.number }},
              generated: true,
              total
            };
            fs.writeFileSync('coverage-report.json', JSON.stringify(report, null, 2));
            console.log('Wrote coverage-report.json');
          "
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: Dechat/dex_with_fiat_frontend/coverage-report.json
          retention-days: 7

  # ── 5. End-to-end tests ───────────────────────────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build, lint]
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: Dechat/dex_with_fiat_frontend/playwright-report/
          retention-days: 7
