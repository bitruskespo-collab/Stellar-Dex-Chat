name: Smart Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"

# Least privilege by default: workflows only need to read repository contents.
# Any job requiring write access must declare it explicitly at the job level.
permissions:
  contents: read

env:
  MAX_WASM_BYTES: "98500"
  STELLAR_CLI_VERSION: "28.0.0"
  BINDINGS_DIR: "Dechat/dex_with_fiat_frontend/src/lib/contracts"
  # Expected chain identity for canary verification. Override per-environment
  # via repository/environment variables; defaults to Stellar testnet.
  EXPECTED_NETWORK_PASSPHRASE: ${{ vars.EXPECTED_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
  EXPECTED_RPC_URL: ${{ vars.EXPECTED_RPC_URL || 'https://soroban-testnet.stellar.org' }}

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Cargo.lock is not drifting alone
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- Dechat/stellar-contracts/Cargo.lock Dechat/stellar-contracts/Cargo.toml Dechat/stellar-contracts/**/Cargo.toml)
          if echo "$CHANGED" | grep -q "Cargo.lock" && ! echo "$CHANGED" | grep -q "Cargo.toml"; then
            echo "Error: Dechat/stellar-contracts/Cargo.lock changed without a matching Cargo.toml change."
            exit 1
          fi
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Run tests
        run: cargo test

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32v1-none
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Build WASM release
        run: stellar contract build
      - name: Check WASM size
        run: |
          set -euo pipefail
          ARTIFACT=target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          ls -la target/wasm32v1-none/release/*.wasm
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: expected contract artifact $ARTIFACT was not produced"
            exit 1
          fi
          SIZE=$(wc -c < "$ARTIFACT" | tr -d '[:space:]')
          echo "Contract WASM size: $SIZE bytes (limit ${MAX_WASM_BYTES})"
          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo "Error: WASM size $SIZE bytes exceeds ${MAX_WASM_BYTES} byte limit"
            exit 1
          fi
      - name: Record artifact digest
        run: |
          set -euo pipefail
          ARTIFACT=target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          DIGEST=$(sha256sum "$ARTIFACT" | awk '{print $1}')
          echo "ARTIFACT_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Contract artifact sha256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-wasm
          path: Dechat/stellar-contracts/target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          if-no-files-found: error

  readiness-gate:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build-wasm]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download contract artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-wasm
          path: artifact
      - name: Verify artifact digest
        run: |
          set -euo pipefail
          DIGEST=$(sha256sum artifact/stellar_contracts.optimized.wasm | awk '{print $1}')
          echo "Artifact digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "::error::Artifact digest missing"
            exit 1
          fi
      - name: Verify network/config
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_NETWORK_PASSPHRASE:-}" ] || [ -z "${EXPECTED_RPC_URL:-}" ]; then
            echo "::error::Network configuration (EXPECTED_NETWORK_PASSPHRASE / EXPECTED_RPC_URL) is not set"
            exit 1
          fi
          echo "Network config OK: $EXPECTED_RPC_URL"
      - name: Verify migrations present
        run: |
          set -euo pipefail
          if [ ! -d "Dechat/stellar-contracts/migrations" ] && [ ! -f "Dechat/stellar-contracts/MIGRATIONS.md" ]; then
            echo "::warning::No migrations directory or MIGRATIONS.md found; confirm no schema migration is required"
          else
            echo "Migrations present"
          fi
      - name: Verify signer availability
        run: |
          set -euo pipefail
          if [ -z "${STELLAR_SIGNER_SECRET:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Signer secret unavailable for promotion"
            exit 1
          fi
          echo "Signer availability check passed"
        env:
          STELLAR_SIGNER_SECRET: ${{ secrets.STELLAR_SIGNER_SECRET }}
      - name: Verify provider health
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$EXPECTED_RPC_URL")
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::RPC provider health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Provider health OK (HTTP $STATUS)"
