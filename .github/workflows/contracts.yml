name: Smart Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - "Dechat/stellar-contracts/**"
      - "Dechat/dex_with_fiat_frontend/src/lib/contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "Dechat/dex_with_fiat_frontend/pnpm-lock.yaml"
      - "Dechat/dex_with_fiat_frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"

# Least privilege by default: workflows only need to read repository contents.
# Any job requiring write access must declare it explicitly at the job level.
permissions:
  contents: read

env:
  MAX_WASM_BYTES: "98500"
  # Pinned toolchain versions. These MUST match the canonical manifest at
  # Dechat/stellar-contracts/toolchain-versions.env and rust-toolchain.toml.
  # The verify-toolchain job fails with a clear mismatch message if they drift.
  RUST_TOOLCHAIN: "1.84.0"
  RUST_TARGET: "wasm32v1-none"
  STELLAR_CLI_VERSION: "28.0.0"
  SOROBAN_SDK_VERSION: "22.0.0"
  RUSTFMT_VERSION: "1.84.0"
  CLIPPY_VERSION: "1.84.0"
  BINDINGS_DIR: "Dechat/dex_with_fiat_frontend/src/lib/contracts"
  # Expected chain identity for canary verification. Override per-environment
  # via repository/environment variables; defaults to Stellar testnet.
  EXPECTED_NETWORK_PASSPHRASE: ${{ vars.EXPECTED_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
  EXPECTED_RPC_URL: ${{ vars.EXPECTED_RPC_URL || 'https://soroban-testnet.stellar.org' }}

jobs:
  verify-toolchain:
    name: Verify pinned toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pinned versions match canonical manifest
        run: |
          set -euo pipefail
          MANIFEST=Dechat/stellar-contracts/toolchain-versions.env
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Canonical toolchain manifest $MANIFEST is missing"
            exit 1
          fi
          # shellcheck disable=SC1090
          source "$MANIFEST"
          fail=0
          check() {
            local name="$1" expected="$2" actual="$3"
            if [ "$expected" != "$actual" ]; then
              echo "::error::Toolchain mismatch for $name: workflow pins '$actual' but manifest pins '$expected'"
              fail=1
            else
              echo "OK: $name = $expected"
            fi
          }
          check RUST_TOOLCHAIN "$RUST_TOOLCHAIN" "${{ env.RUST_TOOLCHAIN }}"
          check RUST_TARGET "$RUST_TARGET" "${{ env.RUST_TARGET }}"
          check STELLAR_CLI_VERSION "$STELLAR_CLI_VERSION" "${{ env.STELLAR_CLI_VERSION }}"
          check SOROBAN_SDK_VERSION "$SOROBAN_SDK_VERSION" "${{ env.SOROBAN_SDK_VERSION }}"
          check RUSTFMT_VERSION "$RUSTFMT_VERSION" "${{ env.RUSTFMT_VERSION }}"
          check CLIPPY_VERSION "$CLIPPY_VERSION" "${{ env.CLIPPY_VERSION }}"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Workflow toolchain pins drifted from $MANIFEST. Update both to the same versions."
            exit 1
          fi

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Verify rustfmt version
        run: |
          set -euo pipefail
          INSTALLED=$(rustfmt --version | awk '{print $2}')
          if [ "$INSTALLED" != "$RUSTFMT_VERSION" ]; then
            echo "::error::rustfmt version mismatch: expected $RUSTFMT_VERSION but found $INSTALLED"
            exit 1
          fi
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Verify clippy version
        run: |
          set -euo pipefail
          INSTALLED=$(cargo clippy --version | awk '{print $2}')
          if [ "$INSTALLED" != "$CLIPPY_VERSION" ]; then
            echo "::error::clippy version mismatch: expected $CLIPPY_VERSION but found $INSTALLED"
            exit 1
          fi
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Cargo.lock is not drifting alone
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- Dechat/stellar-contracts/Cargo.lock Dechat/stellar-contracts/Cargo.toml Dechat/stellar-contracts/**/Cargo.toml)
          if echo "$CHANGED" | grep -q "Cargo.lock" && ! echo "$CHANGED" | grep -q "Cargo.toml"; then
            echo "Error: Dechat/stellar-contracts/Cargo.lock changed without a matching Cargo.toml change."
            exit 1
          fi
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify Rust version
        run: |
          set -euo pipefail
          INSTALLED=$(rustc --version | awk '{print $2}')
          if [ "$INSTALLED" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::rustc version mismatch: expected $RUST_TOOLCHAIN but found $INSTALLED"
            exit 1
          fi
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Run tests
        run: cargo test

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [verify-toolchain]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Dechat/stellar-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"
      - name: Verify Stellar CLI version
        run: |
          set -euo pipefail
          INSTALLED=$(stellar version | head -n1 | awk '{print $2}')
          if [ "$INSTALLED" != "$STELLAR_CLI_VERSION" ]; then
            echo "::error::stellar-cli version mismatch: expected $STELLAR_CLI_VERSION but found $INSTALLED"
            exit 1
          fi
      - name: Verify Soroban SDK version
        run: |
          set -euo pipefail
          INSTALLED=$(grep -E '^soroban-sdk\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$INSTALLED" != "$SOROBAN_SDK_VERSION" ]; then
            echo "::error::soroban-sdk version mismatch: expected $SOROBAN_SDK_VERSION but found '$INSTALLED'"
            exit 1
          fi
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Build WASM release
        run: stellar contract build
      - name: Check WASM size
        run: |
          set -euo pipefail
          ARTIFACT=target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          ls -la target/wasm32v1-none/release/*.wasm
          if [ ! -f "$ARTIFACT" ]; then
            echo "Error: expected contract artifact $ARTIFACT was not produced"
            exit 1
          fi
          SIZE=$(wc -c < "$ARTIFACT" | tr -d '[:space:]')
          echo "Contract WASM size: $SIZE bytes (limit ${MAX_WASM_BYTES})"
          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo "Error: WASM size $SIZE bytes exceeds ${MAX_WASM_BYTES} byte limit"
            exit 1
          fi
      - name: Record artifact digest
        run: |
          set -euo pipefail
          ARTIFACT=target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          DIGEST=$(sha256sum "$ARTIFACT" | awk '{print $1}')
          echo "ARTIFACT_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Contract artifact sha256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-wasm
          path: Dechat/stellar-contracts/target/wasm32v1-none/release/stellar_contracts.optimized.wasm
          if-no-files-found: error

  readiness-gate:
    name: Production Readiness Gate
    runs-on: ubuntu-latest
    needs: [verify-toolchain, fmt, clippy, test, build-wasm]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download contract artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-wasm
          path: artifact
      - name: Verify artifact digest
        run: |
          set -euo pipefail
          DIGEST=$(sha256sum artifact/stellar_contracts.optimized.wasm | awk '{print $1}')
          echo "Artifact digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "::error::Artifact digest missing"
            exit 1
          fi
      - name: Verify network/config
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_NETWORK_PASSPHRASE:-}" ] || [ -z "${EXPECTED_RPC_URL:-}" ]; then
            echo "::error::Network configuration (EXPECTED_NETWORK_PASSPHRASE / EXPECTED_RPC_URL) is not set"
            exit 1
          fi
          echo "Network config OK: $EXPECTED_RPC_URL"
